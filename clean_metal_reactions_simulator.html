        body {
            font-family: 'Inter', sans-serif;
            background-color: #f1f5f9;
        }
        .mono-font {
            font-family: 'JetBrains Mono', monospace;
        }
        /* Smooth custom transition effects */
        .badge-transition {
            transition: all 0.3s ease;
        }
    </style>

    <!-- Main Card Container -->

        <!-- Header Text -->
        <p class="text-xs sm:text-sm text-slate-500 font-medium">
            Select a <strong class="text-slate-800">Metal</strong> and a <strong class="text-slate-800">Solution / condition</strong> to observe the animated chemical reaction.
        </p>

        <!-- Dropdown Controls Bar -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <!-- Metal Dropdown -->
            <div class="space-y-1.5">
                <label for="metal-select" class="block text-xs font-semibold text-slate-700">Metal</label>
                <div class="relative">
                    <select id="metal-select" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm font-medium text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 appearance-none cursor-pointer transition">
                        <option value="Mg" selected>Magnesium (Mg)</option>
                        <option value="Na">Sodium (Na)</option>
                        <option value="Ca">Calcium (Ca)</option>
                        <option value="Al">Aluminium (Al)</option>
                        <option value="Zn">Zinc (Zn)</option>
                        <option value="Fe">Iron (Fe)</option>
                        <option value="Pb">Lead (Pb)</option>
                        <option value="Cu">Copper (Cu)</option>
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-slate-400">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                    </div>
                </div>
            </div>

            <!-- Condition Dropdown -->
            <div class="space-y-1.5">
                <label for="condition-select" class="block text-xs font-semibold text-slate-700">Solution / condition</label>
                <div class="relative">
                    <select id="condition-select" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm font-medium text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 appearance-none cursor-pointer transition">
                        <option value="water" selected>Cold water</option>
                        <option value="steam">Steam</option>
                        <option value="hcl">Hydrochloric acid (HCl)</option>
                        <option value="h2so4">Dilute sulfuric acid (H₂SO₄)</option>
                        <option value="hno3">Nitric acid (HNO₃)</option>
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-slate-400">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                    </div>
                </div>
            </div>
        </div>

        <!-- Visual Animation Stage -->
        <div class="relative w-full h-[280px] sm:h-[320px] bg-sky-100/70 rounded-2xl overflow-hidden border border-sky-200/60 flex items-center justify-center">
            <canvas id="reaction-canvas" class="w-full h-full block"></canvas>
        </div>

        <!-- Bottom Observations & Details Box -->
        <div class="bg-slate-50 border border-slate-200/90 rounded-2xl p-4 sm:p-5 space-y-3.5">
            
            <!-- Reaction Status Badge & Intensity Bar -->
            <div class="flex flex-wrap items-center justify-between gap-2">
                <span id="status-badge" class="px-3 py-1 rounded-full text-xs font-semibold bg-blue-100 text-blue-700 badge-transition">
                    Reaction happening
                </span>

                <!-- Reaction Speed/Intensity Meter -->

                    <span>Intensity:</span>
                    <div class="w-24 sm:w-32 bg-slate-200 rounded-full h-2 overflow-hidden">
                        <div id="intensity-bar" class="bg-blue-500 h-full rounded-full transition-all duration-500" style="width: 15%;"></div>
                    </div>
                    <span id="intensity-text" class="font-medium text-slate-700">Slow</span>
                </div>
            </div>

            <!-- Observation Text -->

            </div>
        </div>

        let particles = [];
        let steamParticles = [];

        // Resize Canvas dynamically
        function setupCanvas() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
        }

        // Particle Class for Gas Bubbles
        class Bubble {
            constructor(x, y, gasType = 'H2') {
                this.x = x + (Math.random() - 0.5) * 35;
                this.y = y + (Math.random() - 0.5) * 10;
                this.radius = Math.random() * 3 + 1.5;
                this.speed = Math.random() * 1.8 + 0.8;
                this.wobble = Math.random() * Math.PI * 2;
                this.gasType = gasType;
                this.opacity = Math.random() * 0.4 + 0.6;
            }

            update() {
                this.y -= this.speed;
                this.wobble += 0.05;
                this.x += Math.sin(this.wobble) * 0.5;
            }

            draw(ctx) {
                ctx.save();
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                if (this.gasType === 'NO2') {
                    ctx.fillStyle = `rgba(180, 83, 9, ${this.opacity * 0.7})`;
                } else {
                    ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                    ctx.strokeStyle = `rgba(148, 163, 184, 0.5)`;
                    ctx.lineWidth = 0.5;
                    ctx.stroke();
                }
                ctx.fill();
                ctx.restore();
            }
        }

        // Particle Class for Steam Vapour
        class Steam {
            constructor(x, y, gasType = 'H2') {
                this.x = x + (Math.random() - 0.5) * 60;
                this.y = y;
                this.radius = Math.random() * 6 + 3;
                this.speed = Math.random() * 1.2 + 0.5;
                this.opacity = 0.35;
                this.gasType = gasType;
            }

            update() {
                this.y -= this.speed;
                this.radius += 0.1;
                this.opacity -= 0.005;
            }

            draw(ctx) {
                ctx.save();
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                if (this.gasType === 'NO2') {
                    ctx.fillStyle = `rgba(180, 83, 9, ${Math.max(0, this.opacity)})`;
                } else {
                    ctx.fillStyle = `rgba(255, 255, 255, ${Math.max(0, this.opacity * 0.8)})`;
                }
                ctx.fill();
                ctx.restore();
            }
        }

        function drawScene() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const cx = canvas.width / 2;
            const cy = canvas.height / 2;

            // Ground Surface Line
            const groundY = canvas.height - 24;
            ctx.strokeStyle = '#64748b'; // slate ground line
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(0, groundY);
            ctx.lineTo(canvas.width, groundY);
            ctx.stroke();

            // Glass Beaker Dimensions
            const bWidth = 170;
            const bHeight = 180;
            const bX = cx - bWidth / 2;
            const bY = groundY - bHeight;

            const liquidHeight = bHeight * 0.55;
            const liquidY = bY + (bHeight - liquidHeight);

            // Draw Liquid in Beaker
            ctx.save();
            ctx.fillStyle = currentReaction ? currentReaction.liquidColor : 'rgba(186, 230, 253, 0.6)';
            ctx.beginPath();
            ctx.roundRect(bX + 4, liquidY, bWidth - 8, liquidHeight - 2, [0, 0, 16, 16]);
            ctx.fill();

            // Surface Water Line
            ctx.beginPath();
            ctx.ellipse(cx, liquidY, bWidth / 2 - 4, 6, 0, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
            ctx.fill();
            ctx.restore();

            // Draw Metal Cube inside Beaker
            const metalSize = 42;
            const metalX = cx - metalSize / 2;
            const metalY = bY + bHeight - metalSize - 10;

            ctx.save();
            // Rounded 3D Metal Cube
            ctx.fillStyle = '#94a3b8'; // Metallic grey
            ctx.beginPath();
            ctx.roundRect(metalX, metalY, metalSize, metalSize, 8);
            ctx.fill();
            ctx.strokeStyle = '#475569';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            // Cube 3D Highlight
            ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
            ctx.beginPath();
            ctx.roundRect(metalX + 4, metalY + 4, metalSize - 16, metalSize - 16, 4);
            ctx.fill();
            ctx.restore();

            // Spawn Bubbles based on reaction intensity
            if (currentReaction && currentReaction.bubbleRate > 0) {
                if (Math.random() < currentReaction.bubbleRate) {
                    particles.push(new Bubble(cx, metalY + 10, currentReaction.gasType));
                }
            }

            // Spawn Steam if condition is Steam or intense NO2 reaction
            if (currentReaction && currentReaction.hasSteam) {
                if (Math.random() < 0.4) {
                    steamParticles.push(new Steam(cx, liquidY - 10, currentReaction.gasType));
                }
            }

            // Draw & Update Gas Bubbles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.update();
                p.draw(ctx);
                if (p.y < liquidY || p.opacity <= 0) {
                    particles.splice(i, 1);
                }
            }

            // Draw & Update Steam Particles
            for (let i = steamParticles.length - 1; i >= 0; i--) {
                const s = steamParticles[i];
                s.update();
                s.draw(ctx);
                if (s.opacity <= 0 || s.y < bY - 40) {
                    steamParticles.splice(i, 1);
                }
            }

            // Draw Glass Beaker Outline
            ctx.save();
            ctx.strokeStyle = '#475569'; // Dark grey glass outline
            ctx.lineWidth = 3.5;
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';

            ctx.beginPath();
            ctx.moveTo(bX, bY);
            ctx.lineTo(bX, bY + bHeight - 16);
            ctx.quadraticCurveTo(bX, bY + bHeight, bX + 16, bY + bHeight);
            ctx.lineTo(bX + bWidth - 16, bY + bHeight);
            ctx.quadraticCurveTo(bX + bWidth, bY + bHeight, bX + bWidth, bY + bHeight - 16);
            ctx.lineTo(bX + bWidth, bY);
            ctx.stroke();

            // Glass Shine Highlight
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(bX + 10, bY + 15);
            ctx.lineTo(bX + 10, bY + bHeight - 25);
            ctx.stroke();

            ctx.restore();
        }

        function updateReaction() {
            const metal = metalSelect.value;
            const condition = conditionSelect.value;
            const key = `${metal}_${condition}`;

            // Fallback default reaction if combination isn't explicitly listed
            const fallback = {
                status: 'Slow Reaction',
                statusBg: 'bg-blue-100 text-blue-700',
                intensity: 20,
                speedText: 'Slow',
                obs: `Slow displacement reaction between ${metalSelect.options[metalSelect.selectedIndex].text} and ${conditionSelect.options[conditionSelect.selectedIndex].text}.`,
                gas: 'Hydrogen (H₂)',
                eq: `${metal} + Acid → Salt + H₂`,
                liquidColor: 'rgba(224, 242, 254, 0.6)',
                bubbleRate: 0.3,
                hasSteam: false
            };

            currentReaction = REACTION_DATA[key] || fallback;

            // Clear particles on switch
            particles = [];
            steamParticles = [];

            // Update UI Card Text
            statusBadge.className = `px-3 py-1 rounded-full text-xs font-semibold badge-transition ${currentReaction.statusBg}`;
            statusBadge.innerText = currentReaction.status;

            intensityBar.style.width = `${currentReaction.intensity}%`;
            intensityText.innerText = currentReaction.speedText;

            observationText.innerText = currentReaction.obs;
            gasText.innerText = currentReaction.gas;
            equationText.innerText = currentReaction.eq;
        }

        // Animation Loop
        function animate() {
            drawScene();
            requestAnimationFrame(animate);
        }

        // Event Handlers
        metalSelect.addEventListener('change', updateReaction);
        conditionSelect.addEventListener('change', updateReaction);

        window.addEventListener('resize', setupCanvas);

        // Initialization
        window.onload = function() {
            setupCanvas();
            updateReaction();
            animate();
        };
    </script>
</body>
</html>
